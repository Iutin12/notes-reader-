name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-native-omr-macos.sh
      - run: pnpm desktop:build:mac -- --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Notera-macOS-arm64
          path: release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: ./scripts/build-native-omr-windows.ps1
      - run: pnpm desktop:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Notera-Windows-x64
          path: release/*.exe
