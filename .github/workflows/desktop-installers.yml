name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  actions: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-native-omr-macos.sh
      - run: pnpm desktop:build:mac -- --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Notera-macOS-arm64
          path: release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: ./scripts/build-native-omr-windows.ps1
      - run: pnpm desktop:build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Notera-Windows-x64
          path: release/*.exe

  cleanup:
    # Keep the current run plus four previous runs. Deleting a workflow run
    # also removes its installer artifacts, so the Actions page stays tidy.
    needs: [macos, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the latest five installer builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = "desktop-installers.yml";
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              per_page: 100,
            });

            // Keep this run even while it is still finishing, then retain the
            // four newest other runs. This guarantees no more than five runs.
            const currentRunId = context.runId;
            const previousRuns = data.workflow_runs
              .filter((run) => run.id !== currentRunId)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const runsToDelete = previousRuns.slice(4);

            for (const run of runsToDelete) {
              core.info(`Deleting old installer build #${run.run_number} (${run.id})`);
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
            }
